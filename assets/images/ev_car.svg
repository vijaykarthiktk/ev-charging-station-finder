<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 180" role="img" aria-label="Electric car charging">
  <ellipse cx="160" cy="158" rx="120" ry="10" fill="#000000" opacity="0.08"/>
  <!-- wallbox -->
  <rect x="28" y="78" width="34" height="56" rx="6" fill="#1A1C19"/>
  <rect x="34" y="88" width="22" height="14" rx="2" fill="#6FDC9C"/>
  <circle cx="45" cy="116" r="3" fill="#0B7A55"/>
  <!-- cable -->
  <path d="M62 106 C 84 106 82 124 106 124" fill="none" stroke="#1A1C19" stroke-width="5" stroke-linecap="round"/>
  <!-- car body -->
  <path d="M60 128 L70 100 Q72 94 80 94 L120 94 L140 66 Q142 62 148 62 L205 62 Q211 62 213 66 L232 94 L258 94 Q266 94 268 102 L272 120 Q273 128 265 128 Z" fill="#0E8A5F"/>
  <!-- glasshouse -->
  <path d="M148 69 H197 L209 91 H143 Z" fill="#083B2A"/>
  <!-- charge port -->
  <circle cx="112" cy="118" r="5" fill="#1A1C19"/>
  <circle cx="112" cy="118" r="2" fill="#6FDC9C"/>
  <!-- lights -->
  <rect x="258" y="104" width="12" height="8" rx="3" fill="#FFE08A"/>
  <rect x="60" y="104" width="8" height="10" rx="2" fill="#FF6B6B"/>
  <!-- door line -->
  <line x1="172" y1="94" x2="172" y2="126" stroke="#0A5C40" stroke-width="2"/>
  <!-- bolt badge -->
  <polygon points="189,99 180,112 186,112 184,121 193,109 187,109" fill="#FFD54A"/>
  <!-- wheels -->
  <circle cx="105" cy="130" r="20" fill="#1A1C19"/>
  <circle cx="105" cy="130" r="8" fill="#9AA5A0"/>
  <circle cx="230" cy="130" r="20" fill="#1A1C19"/>
  <circle cx="230" cy="130" r="8" fill="#9AA5A0"/>
</svg>
